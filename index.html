<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Drawing App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #controls {
      margin-bottom: 10px;
    }

    #mySvg {
      border: 2px solid #333;
      width: 600px;
      height: 400px;
      cursor: crosshair;
    }

    button, input[type="color"] {
      margin-right: 10px;
      padding: 5px 10px;
    }
  </style>
</head>
<body>
  <h1>SVG Drawing App</h1>

  <div id="controls">
    <button id="clearBtn">Clear Canvas</button>
    <label for="colorPicker">Choose color:</label>
    <input type="color" id="colorPicker" value="#000000">
  </div>

  <svg id="mySvg"></svg>

  <script>
    const svg = document.getElementById("mySvg");
    const clearBtn = document.getElementById("clearBtn");
    const colorPicker = document.getElementById("colorPicker");

    let drawing = false;
    let polyline = null;

    svg.addEventListener("mousedown", (e) => {
      drawing = true;

      // Create a new polyline
      polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      polyline.setAttribute("fill", "none");
      polyline.setAttribute("stroke", colorPicker.value);
      polyline.setAttribute("stroke-width", "2");
      polyline.setAttribute("points", `${e.offsetX},${e.offsetY}`);
      svg.appendChild(polyline);
    });

    svg.addEventListener("mousemove", (e) => {
      if (!drawing) return;
      const points = polyline.getAttribute("points");
      polyline.setAttribute("points", points + ` ${e.offsetX},${e.offsetY}`);
    });

    svg.addEventListener("mouseup", () => {
      drawing = false;
    });

    svg.addEventListener("mouseleave", () => {
      drawing = false;
    });

    clearBtn.addEventListener("click", () => {
      svg.innerHTML = ""; // Remove all lines
    });
  </script>
</body>
</html>
